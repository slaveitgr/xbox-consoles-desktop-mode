name: Mihawk Xbox desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mihawk:
    name: Native Mihawk x64 UWP desktop
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Ensure VS 2022 C++ UWP prerequisites
        id: toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'The runner has no Visual Studio 2022 C++ installation.' }
          $uwpPath = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.ComponentGroup.UWP.VC -property installationPath
          $sdkHeaders = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.26100.0\cppwinrt\winrt\base.h"
          if (-not $uwpPath -or -not (Test-Path $sdkHeaders)) {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $installArgs = @('modify', '--installPath', "`"$vsPath`"", '--channelId', 'VisualStudio.17.Release',
              '--add', 'Microsoft.VisualStudio.ComponentGroup.UWP.VC',
              '--add', 'Microsoft.VisualStudio.Component.Windows11SDK.26100', '--quiet', '--norestart')
            $process = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "Visual Studio prerequisite install failed: $($process.ExitCode)." }
          }
          ./tools/build-uwp.ps1 -CheckOnly | Format-List
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic artwork generator dependencies
        run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: Run Windows host checks
        run: |
          cmake -S . -B build-windows -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed.' }
          cmake --build build-windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed.' }
          ctest --test-dir build-windows -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Host tests failed.' }
      - name: Build source-pinned Win32Bridge with PE32 backend
        run: ./tools/build-upstream.ps1 -Configuration Release -WithX86Backend
      - name: Build and sign native Mihawk desktop
        run: ./tools/build-mihawk.ps1 -Configuration Release
      - name: Reject signing keys in outputs
        if: always()
        run: |
          $keys = @(Get-ChildItem artifacts -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.pfx','.p12','.key') })
          if ($keys.Count -gt 0) { throw 'Private signing keys must not be uploaded.' }
      - name: Upload development desktop
        uses: actions/upload-artifact@v4
        with:
          name: mihawk-xbox-x64-1.0.47.0-DEV-SIGNED
          path: |
            artifacts/mihawk-desktop/*.msix
            artifacts/mihawk-desktop/*.cer
            artifacts/mihawk-desktop/*.json
          if-no-files-found: error
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mihawk-build-logs
          path: |
            artifacts/mihawk-desktop/*.log
            artifacts/upstream-bridge-x86/Release/*.log
            build-windows/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
