name: ProtonDesktop Windows port

on:
  push:
    branches: ['codex/protondesktop']
    paths: ['ProtonDesktop/**', '.github/workflows/protondesktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-host:
    if: ${{ !contains(github.event.head_commit.message, '[core-only]') && !contains(github.event.head_commit.message, '[uwp-core-only]') && !contains(github.event.head_commit.message, '[platform-only]') && !contains(github.event.head_commit.message, '[sdlvideo-only]') && !contains(github.event.head_commit.message, '[sdlwinrt-only]') && !contains(github.event.head_commit.message, '[wine-app-only]') }}
    name: Compile native UWP host
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: ProtonDesktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: andrewnakas/Boxedwine64
          ref: 58ecb0fffdd11e05bb62e7f0e80dd1af7c6402a4
          path: ProtonDesktop/external/Boxedwine64-full
          persist-credentials: false
          sparse-checkout: |
            include
            source
            platform
            lib/sdl2/include
            lib/simde
            lib/softfloat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original package assets
        run: python tools/generate_assets.py
      # Install missing UWP tools before launching any MSBuild worker. Cached
      # MSBuild nodes cause the official installer to reject modification (8006).
      - name: Compile unsigned UWP host
        run: ./tools/ci/build_windows_host.ps1
      - name: Build and test portable contracts
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build/windows-contracts -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Contract configure failed.' }
          cmake --build build/windows-contracts --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Contract build failed.' }
          ctest --test-dir build/windows-contracts -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Contract tests failed.' }
      - name: Build and check UWP non-executable memory adapter
        if: ${{ !cancelled() }}
        run: |
          $source = (Resolve-Path external/Boxedwine64-full).Path
          cmake -S backend/uwp -B build/uwp-memory -A x64 "-DBOXEDWINE_SOURCE=$source"
          if ($LASTEXITCODE -ne 0) { throw 'Memory adapter configure failed.' }
          cmake --build build/uwp-memory --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Memory adapter build failed.' }
          ctest --test-dir build/uwp-memory -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Memory adapter tests failed.' }
      - name: Upload compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protondesktop-uwp-host-compile
          path: |
            ProtonDesktop/artifacts/windows-host/
            ProtonDesktop/build/windows-contracts/Testing/Temporary/LastTest.log
            ProtonDesktop/build/uwp-memory/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  windows-core:
    if: ${{ !contains(github.event.head_commit.message, '[host-only]') && !contains(github.event.head_commit.message, '[uwp-core-only]') && !contains(github.event.head_commit.message, '[platform-only]') && !contains(github.event.head_commit.message, '[sdlvideo-only]') && !contains(github.event.head_commit.message, '[sdlwinrt-only]') && !contains(github.event.head_commit.message, '[wine-app-only]') }}
    name: Build and run actual x64 interpreter on Windows
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: ProtonDesktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: andrewnakas/Boxedwine64
          ref: 58ecb0fffdd11e05bb62e7f0e80dd1af7c6402a4
          path: ProtonDesktop/external/Boxedwine64-full
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure and build pinned Windows core
        run: ./tools/ci/build_windows_core.ps1
      - name: Run real interpreter diagnostics
        run: python tools/ci/run_windows_core.py --executable build/windows-core/boxedwine64-windows.exe --output artifacts/windows-core
      - name: Build and test UWP platform services on Windows
        if: ${{ !cancelled() }}
        run: |
          $source = (Resolve-Path external/Boxedwine64-full).Path
          cmake -S . -B build/windows-platform -A x64 "-DBOXEDWINE_SOURCE=$source"
          if ($LASTEXITCODE -ne 0) { throw 'Platform configure failed.' }
          cmake --build build/windows-platform --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Platform build failed.' }
          ctest --test-dir build/windows-platform -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Platform tests failed.' }
      - name: Upload core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protondesktop-windows-x64-core
          path: |
            ProtonDesktop/artifacts/windows-core/
            ProtonDesktop/build/windows-core/compile_commands.json
            ProtonDesktop/build/windows-core/CMakeCache.txt
            ProtonDesktop/build/windows-platform/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  uwp-core:
    name: Compile actual interpreter with UWP API partition
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[uwp-core-only]') }}
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: ProtonDesktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: andrewnakas/Boxedwine64
          ref: 58ecb0fffdd11e05bb62e7f0e80dd1af7c6402a4
          path: ProtonDesktop/external/Boxedwine64-full
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original host assets
        run: python tools/generate_assets.py
      - name: Ensure pinned UWP tools and compile host
        run: ./tools/ci/build_windows_host.ps1
      - name: Check first-boot contract and UWP platform adapters
        run: |
          $source = (Resolve-Path external/Boxedwine64-full).Path
          cmake -S . -B build/uwp-core-contracts -A x64 "-DBOXEDWINE_SOURCE=$source"
          if ($LASTEXITCODE -ne 0) { throw 'Contract configure failed.' }
          cmake --build build/uwp-core-contracts --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Contract build failed.' }
          ctest --test-dir build/uwp-core-contracts -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Contract tests failed.' }
      - name: Compile and link genuine UWP core
        id: uwp_core_link
        if: ${{ !cancelled() }}
        run: ./tools/ci/build_uwp_core.ps1
      - name: Build unsigned application linked to the real core
        if: ${{ !cancelled() && steps.uwp_core_link.outcome == 'success' }}
        run: ./tools/ci/build_uwp_probe.ps1
      - name: Upload UWP core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protondesktop-uwp-core-qualification
          path: |
            ProtonDesktop/artifacts/uwp-core/
            ProtonDesktop/artifacts/uwp-probe/
            ProtonDesktop/artifacts/uwp-core-probe/packages/
            ProtonDesktop/build/uwp-core/compile_commands.json
            ProtonDesktop/build/uwp-core/CMakeCache.txt
            ProtonDesktop/build/uwp-core/qualification-scope.txt
            ProtonDesktop/build/uwp-core-contracts/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  platform-contracts:
    name: Run actual UWP API service tests on desktop Windows
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[platform-only]') || contains(github.event.head_commit.message, '[uwp-core-only]') }}
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: ProtonDesktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: andrewnakas/Boxedwine64
          ref: 58ecb0fffdd11e05bb62e7f0e80dd1af7c6402a4
          path: ProtonDesktop/external/Boxedwine64-full
          persist-credentials: false
          sparse-checkout: |
            include
            source
            platform
            lib/sdl2/include
            lib/simde
            lib/softfloat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile genuine APP-family adapters and execute host tests
        run: |
          $source = (Resolve-Path external/Boxedwine64-full).Path
          cmake -S . -B build/platform-contracts -A x64 "-DBOXEDWINE_SOURCE=$source"
          if ($LASTEXITCODE -ne 0) { throw 'Platform configure failed.' }
          cmake --build build/platform-contracts --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Platform build failed.' }
          ctest --test-dir build/platform-contracts -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Platform tests failed.' }
      - name: Upload host test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protondesktop-platform-services
          path: |
            ProtonDesktop/build/platform-contracts/Testing/Temporary/LastTest.log
            ProtonDesktop/build/platform-contracts/CMakeCache.txt
          if-no-files-found: warn

  sdlvideo-app:
    name: Qualify real SDL software pixels with APP headers
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sdlvideo-only]') }}
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: ProtonDesktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: andrewnakas/Boxedwine64
          ref: 58ecb0fffdd11e05bb62e7f0e80dd1af7c6402a4
          path: ProtonDesktop/external/Boxedwine64-full
          persist-credentials: false
          sparse-checkout: |
            include
            source
            platform
            lib/sdl2
            lib/simde
            lib/softfloat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original host assets
        run: python tools/generate_assets.py
      - name: Ensure official UWP SDK and CRT components
        run: ./tools/ci/build_windows_host.ps1
      - name: Build and run the actual SDL software pipeline
        run: ./tools/ci/build_sdlvideo_app.ps1
      - name: Upload software pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protondesktop-sdlvideo-app-family
          path: |
            ProtonDesktop/artifacts/sdlvideo/
            ProtonDesktop/build/sdlvideo-app/Testing/Temporary/LastTest.log
            ProtonDesktop/build/sdlvideo-app/compile_commands.json
            ProtonDesktop/build/sdlvideo-app/CMakeCache.txt
            ProtonDesktop/build/sdlvideo-app/qualification-scope.txt
          if-no-files-found: warn


  sdl-winrt:
    name: Compile existing native SDL WinRT renderer
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sdlwinrt-only]') }}
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: ProtonDesktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: andrewnakas/Boxedwine64
          ref: 58ecb0fffdd11e05bb62e7f0e80dd1af7c6402a4
          path: ProtonDesktop/external/Boxedwine64-full
          persist-credentials: false
          sparse-checkout: |
            lib/sdl2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original host assets
        run: python tools/generate_assets.py
      - name: Ensure official UWP SDK and C++ tools
        run: ./tools/ci/build_windows_host.ps1
      - name: Compile pinned SDL WinRT with its C++/CX source
        run: ./tools/ci/build_sdl_winrt.ps1
      - name: Upload existing renderer compilation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protondesktop-sdl-winrt-compile
          path: ProtonDesktop/artifacts/sdl-winrt/
          if-no-files-found: warn


  wine-app:
    name: Build actual native Wine desktop application
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[wine-app-only]') }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      MSBUILDDISABLENODEREUSE: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: ProtonDesktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: andrewnakas/Boxedwine64
          ref: 58ecb0fffdd11e05bb62e7f0e80dd1af7c6402a4
          path: ProtonDesktop/external/Boxedwine64-full
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate original package assets
        run: python tools/generate_assets.py
      - name: Ensure official UWP SDK and C++ tools
        run: ./tools/ci/build_windows_host.ps1
      - name: Check real archive and guest worker contracts on Windows
        run: |
          $source = (Resolve-Path external/Boxedwine64-full).Path
          cmake -S . -B build/wine-contracts -A x64 "-DBOXEDWINE_SOURCE=$source"
          if ($LASTEXITCODE -ne 0) { throw 'Wine contracts configure failed.' }
          cmake --build build/wine-contracts --config Release --target protondesktop_guest_worker_tests protondesktop_guest_softfloat_tests proton-archive-tests --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Wine contracts build failed.' }
          ctest --test-dir build/wine-contracts -C Release -R 'protondesktop_guest_workers|protondesktop_softfloat_tls|protondesktop_owned_workers_overlay|protondesktop_wine_session_overlay|proton-real-minizip' --timeout 60 --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Wine contracts failed.' }
      - name: Build existing native SDL WinRT library
        id: wine_sdl_build
        if: ${{ !cancelled() }}
        run: ./tools/ci/build_sdl_winrt.ps1
      - name: Build retained Wine kernel and session
        id: wine_core_build
        if: ${{ !cancelled() && steps.wine_sdl_build.outcome == 'success' }}
        run: ./tools/ci/build_wine_core.ps1
      - name: Package real Wine session application
        if: ${{ !cancelled() && steps.wine_core_build.outcome == 'success' }}
        run: |
          $builtins = (Get-Content artifacts/wine-core/clang-builtins-path.txt -Raw).Trim()
          ./tools/ci/build_wine_app.ps1 -WineLibDir artifacts/wine-core/native-libs -SdlWinrtDir build/sdl-winrt/out -ClangBuiltins $builtins
      - name: Upload actual Wine application build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protondesktop-native-wine-build
          path: |
            ProtonDesktop/artifacts/sdl-winrt/
            ProtonDesktop/artifacts/wine-core/
            ProtonDesktop/artifacts/uwp-wine/
            ProtonDesktop/build/sdl-winrt/out/*.dll
            ProtonDesktop/build/sdl-winrt/out/*.lib
            ProtonDesktop/build/wine-core/compile_commands.json
            ProtonDesktop/build/wine-core/qualification-scope.txt
            ProtonDesktop/build/wine-contracts/Testing/Temporary/LastTest.log
          if-no-files-found: warn
